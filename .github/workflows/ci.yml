name: CI

# Run on every PR and on pushes to the default branch. The default branch
# of this repo is not named main/master, so the previous main/master-only
# trigger meant CI never ran at all.
on:
  push:
    branches: [main, master, claude/initial-repo-setup-067NM]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ecj-chatbot/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ecj-chatbot/requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          cd ecj-chatbot
          python -m pytest tests/ -v --tb=short

      - name: Run tests with coverage
        if: matrix.python-version == '3.12'
        run: |
          cd ecj-chatbot
          python -m pytest tests/ --cov=src --cov-report=term-missing
